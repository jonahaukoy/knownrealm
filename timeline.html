<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Timeline — The Known Realm</title>
<meta name="description" content="Twelve thousand years of the Known World on one draggable bar, with a map that repaints itself as you move: who ruled where, and how many lived there." />
<link rel="preload" href="css/fonts/cinzel-400-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="css/fonts/cinzel-600-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="css/fonts/ebgaramond-400-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/timeline.css" />
<script>try{var t=localStorage.getItem("kwTheme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body class="tl-body">

<header class="topbar tl-topbar">
  <a class="brand home-brand" href="index.html" style="text-decoration:none;color:var(--text-light)">
    <span class="brand-icon">&#8987;</span>
    <span class="brand-name">THE TIMELINE</span>
  </a>
  <div class="tl-topnote" id="tl-topnote">Drag the bar &mdash; the world follows.</div>
  <div style="flex:1"></div>
</header>

<!-- ============ the bar: twelve thousand years, and the age written on it ============ -->
<section class="tl-bar" id="tl-bar" aria-label="The years of the Known World">
  <div class="tl-bar-left">
    <button class="tl-step tl-step-far" id="tl-back-far" type="button" title="Back to the moment before">&#171;</button>
    <button class="tl-step" id="tl-back-one" type="button" title="One year back (or press &larr;)">&#8249;</button>
    <div class="tl-readout">
      <div class="tl-year" id="tl-year">&nbsp;</div>
      <div class="tl-eraname" id="tl-eraname">&nbsp;</div>
    </div>
    <button class="tl-step" id="tl-fwd-one" type="button" title="One year on (or press &rarr;)">&#8250;</button>
    <button class="tl-step tl-step-far" id="tl-fwd-far" type="button" title="On to the next moment">&#187;</button>
  </div>

  <div class="tl-track" id="tl-track" tabindex="0" role="slider"
       aria-label="Year" aria-valuemin="-12000" aria-valuemax="306" aria-valuenow="298">
    <div class="tl-eraband" id="tl-eraband"></div>
    <div class="tl-ruler" id="tl-ruler"></div>
    <div class="tl-moments" id="tl-moments"></div>
    <div class="tl-handle" id="tl-handle"><span class="tl-handle-flag" id="tl-handle-flag"></span></div>
  </div>
</section>

<!-- ============ the stage: what happened, and where ============ -->
<div class="tl-stage" id="tl-stage">

  <aside class="tl-panel" id="tl-panel">
    <div class="tl-panel-inner" id="tl-panel-inner"></div>
  </aside>

  <div class="tl-mapwrap" id="tl-mapwrap">
    <svg id="tl-map" viewBox="0 0 5652 3682" preserveAspectRatio="xMidYMid meet">
      <g id="tl-map-vp">
        <image id="tl-basemap" href="assets/ASOIAF_map_redrawn_v6.jpg" x="0" y="0" width="5652" height="3682" />
        <g id="tl-terr-layer"></g>
        <g id="tl-label-layer"></g>
      </g>
    </svg>

    <div class="tl-maptip" id="tl-maptip" hidden></div>
    <div class="tl-legend" id="tl-legend"></div>

    <div class="tl-maphint" id="tl-maphint">Hover a land to see who holds it &middot; click it to read on</div>

    <div class="tl-mapctl">
      <button id="tl-zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
      <button id="tl-zoom-out" type="button" title="Zoom out" aria-label="Zoom out">&minus;</button>
      <button id="tl-zoom-fit" type="button" title="The whole world" aria-label="Fit the whole world">&#9974;</button>
    </div>

    <button class="tl-mapsize" id="tl-mapsize" type="button" aria-expanded="false">Expand the map</button>
  </div>
</div>

<script src="js/shield.js" data-kw-shield="1"></script>
<script src="js/timeline-axis.js"></script>
<script src="js/peoples-data.js"></script>
<script src="js/timeline-territories.js"></script>
<script src="js/timeline-data.js"></script>
<script src="js/popgraph.js"></script>
<script src="js/timeline-map.js"></script>
<script src="js/timeline-engine.js"></script>
<script src="js/realm-nav.js" data-root=""></script>
</body>
</html>
