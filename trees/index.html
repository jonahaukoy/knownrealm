<script>try{var t=localStorage.getItem("kwTheme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
  /* base style.css pins the page for the map; this one scrolls like a document */
  html { height: auto; overflow-y: auto; }
  body.wip-body {
    min-height: 100vh; display: flex; flex-direction: column;
    background:
      linear-gradient(180deg, rgba(12, 10, 7, 0.9), rgba(12, 10, 7, 0.97)),
      url("../assets/ASOIAF_map.jpg") center 30% / cover no-repeat;
    color: var(--text-light);
  }
  .wip-main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px 16px 60px;
  }
  .wip-card {
    max-width: 560px; width: 100%; text-align: center;
    padding: 40px 28px 34px; border-radius: 16px;
    background: linear-gradient(180deg, rgba(22, 18, 12, 0.94), rgba(14, 11, 8, 0.96));
    border: 1px solid rgba(201, 161, 90, 0.42);
    box-shadow: 0 22px 60px rgba(0, 0, 0, 0.6);
  }
  .wip-crest { font-size: 40px; color: var(--gold); line-height: 1; margin-bottom: 6px; }
  .wip-kicker {
    font-family: var(--serif-body); font-style: italic; font-size: 14px;
    color: var(--gold); opacity: 0.9; margin-bottom: 4px;
  }
  .wip-card h1 {
    font-family: var(--serif-display); font-size: 30px; letter-spacing: 1.5px;
    margin: 0 0 14px; color: #f0e6d2;
  }
  .wip-card p {
    font-family: var(--serif-body); font-size: 15.5px; line-height: 1.7;
    color: #cdbf9f; margin: 0 auto 12px; max-width: 430px;
  }
  .wip-links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
  .wip-links a {
    font-family: var(--serif-display); font-size: 12px; letter-spacing: 1.1px;
    text-decoration: none; padding: 11px 16px; border-radius: 8px;
    color: var(--gold-bright); background: rgba(201, 161, 90, 0.1);
    border: 1px solid rgba(201, 161, 90, 0.42);
    transition: background 0.16s, border-color 0.16s;
  }
  .wip-links a:hover { background: rgba(201, 161, 90, 0.22); border-color: var(--gold); }
  @media (max-width: 560px) {
    .wip-card { padding: 30px 16px 26px; }
    .wip-card h1 { font-size: 23px; }
    .wip-card p { font-size: 14px; }
    .wip-links a { font-size: 11px; padding: 10px 12px; }
  }
</style>
</head>
<body class="wip-body">

<header class="topbar">
  <a class="brand home-brand" href="../index.html" style="text-decoration:none;color:var(--text-light)">

  </a>
  <div style="flex:1"></div>
</header>

<main class="wip-main">
  <div class="wip-card">
    <div class="wip-crest">&#127794;</div>
    <div class="wip-kicker">The maesters are at work</div>
    <h1>Under improvement</h1>
    <p>The family trees are being redrawn &mdash; the blood of the great houses,
      set out afresh. They will open again shortly.</p>
    <p>Everything else in the realm is where you left it.</p>
    <div class="wip-links">
      <a href="../index.html">&#8962; The Known Realm</a>
      <a href="../wiki.html">The Wiki</a>

      <a href="../timeline.html">The Timeline</a>
      <a href="../trivia/index.html">Games &amp; Trivia</a>
    </div>
  </div>
</main>

<script src="../js/realm-nav.js" data-root="../"></script>
</body>
</html>
